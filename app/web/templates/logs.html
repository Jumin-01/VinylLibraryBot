{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center">
    <h2>System Logs</h2>
    <form action="/web/logs/clear" method="post">
        <button type="submit" class="btn btn-danger">Clear Logs</button>
    </form>
</div>

<div class="card mt-3 bg-dark text-light shadow">
    <div class="card-body" style="height: 500px; overflow-y: scroll; font-family: monospace;">
        {% for line in logs %}
            <div>{{ line }}</div>
        {% endfor %}
    </div>
</div>
{% endblock %}
