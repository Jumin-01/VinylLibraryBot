<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VinylBot Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; }
        
        /* Sidebar Styling */
        .sidebar {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            padding: 20px 0;
            width: 250px;
            background-color: #212529;
            color: #fff;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }
        
        .sidebar h3 { text-align: center; margin-bottom: 20px; font-weight: bold; }
        .sidebar hr { border-color: #495057; margin: 0 0 20px 0; }
        
        .nav-link { color: rgba(255,255,255,0.75); padding: 12px 20px; font-size: 1.1rem; display: flex; align-items: center; }
        .nav-link:hover { color: #fff; background-color: rgba(255,255,255,0.1); }
        .nav-link.active { background-color: #0d6efd; color: white; }
        .nav-link i { margin-right: 10px; font-size: 1.2rem; }

        /* Main Content Styling */
        .main-content {
            margin-left: 250px;
            padding: 30px;
            width: calc(100% - 250px);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { position: relative; width: 100%; height: auto; }
            .main-content { margin-left: 0; width: 100%; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>VinylBot 🎵</h3>
        <hr>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link {% if page == 'dashboard' %}active{% endif %}" href="/web/">
                    <i class="bi bi-speedometer2"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if page == 'users' %}active{% endif %}" href="/web/users">
                    <i class="bi bi-people"></i> Users
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if page == 'vinyls' %}active{% endif %}" href="/web/vinyls">
                    <i class="bi bi-disc"></i> Vinyls
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if page == 'logs' %}active{% endif %}" href="/web/logs">
                    <i class="bi bi-journal-text"></i> Logs
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if page == 'settings' %}active{% endif %}" href="/web/settings">
                    <i class="bi bi-gear"></i> Settings
                </a>
            </li>
        </ul>
    </div>

    <div class="main-content">
        {% block content %}{% endblock %}
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
